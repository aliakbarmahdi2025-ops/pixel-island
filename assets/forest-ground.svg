<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" viewBox="0 0 250 250">
<defs>
 <linearGradient id="base" x2="1" y2="1"><stop stop-color="#4c742d"/><stop offset=".48" stop-color="#527b2e"/><stop offset="1" stop-color="#405f28"/></linearGradient>
 <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
  <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="23" stitchTiles="stitch" result="noise"/>
  <feColorMatrix in="noise" type="matrix" values="0.55 0 0 0 0.10 0 0.72 0 0 0.12 0 0 0.42 0 0.02 0 0 0 .55 0" result="tint"/>
  <feBlend in="SourceGraphic" in2="tint" mode="soft-light"/>
 </filter>
 <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
 <pattern id="specks" width="37" height="31" patternUnits="userSpaceOnUse">
  <rect x="3" y="5" width="3" height="2" fill="#9caf4d" opacity=".24"/><rect x="18" y="13" width="4" height="2" fill="#263f20" opacity=".22"/>
  <rect x="29" y="25" width="2" height="3" fill="#b2a34a" opacity=".18"/><rect x="10" y="26" width="2" height="2" fill="#1f4926" opacity=".2"/>
 </pattern>
</defs>
<rect width="250" height="250" fill="url(#base)" filter="url(#grain)"/>
<g filter="url(#soft)" opacity=".36">
 <ellipse cx="48" cy="63" rx="64" ry="43" fill="#75913a"/>
 <ellipse cx="183" cy="51" rx="77" ry="52" fill="#344f25"/>
 <ellipse cx="125" cy="167" rx="85" ry="65" fill="#6c8132"/>
 <ellipse cx="224" cy="211" rx="57" ry="45" fill="#314e25"/>
 <ellipse cx="27" cy="218" rx="52" ry="43" fill="#7a8536"/>
</g>
<rect width="250" height="250" fill="url(#specks)"/>
</svg>