name: Stage 26 JavaScript check
on:
  push:
    branches:
      - stage-26-crafting-construction
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check adventure.js
