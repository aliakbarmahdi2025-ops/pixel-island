<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#17251d">
  <title>Pixel Island: Adventure — مرحله اول</title>
  <link rel="stylesheet" href="adventure.css">
</head>
<body>
  <canvas id="world" aria-label="دنیای بازی"></canvas>
  <header id="hud">
    <div class="status">
      <span>❤️ <b id="health">5</b></span>
      <span>⭐ سطح <b id="level">1</b></span>
      <span>🪙 <b id="coins">0</b></span>
    </div>
    <div class="hud-actions">
      <button id="bagBtn">🎒 کوله‌پشتی</button>
      <button id="upgradeBtn">⭐ مهارت‌ها</button>
      <button id="craftBtn">🛠️ ساخت</button>
      <button id="saveBtn">💾 ذخیره</button>
    </div>
  </header>
  <section id="xpPanel" aria-label="تجربه بازیکن">
    <div class="xp-label"><span>⭐ تجربه</span><b id="xpText">0 / 50 XP</b></div>
    <div class="xp-track"><div id="xpFill"></div></div>
  </section>
  <section id="inventory" class="panel" hidden>
    <h2>🎒 کوله‌پشتی</h2>
    <div class="slots">
      <div>🪵 چوب: <b id="wood">0</b></div>
      <div>🪨 سنگ: <b id="stone">0</b></div>
      <div>⛏️ آهن: <b id="iron">0</b></div>
      <div>💎 کریستال: <b id="crystal">0</b></div>
      <div>🧪 معجون: <b id="potion">0</b></div>
      <button id="usePotion">نوشیدن معجون</button>
    </div>
    <button id="closeBag">بستن</button>
  </section>
  <section id="upgradePanel" class="panel" hidden>
    <h2>⭐ ارتقای شخصیت</h2>
    <p>امتیاز مهارت: <b id="skillPoints">0</b></p>
    <div class="upgrade-list">
      <button id="upgradeHealth">❤️ افزایش جان</button>
      <button id="upgradeSpeed">👟 افزایش سرعت</button>
      <button id="upgradeAttack">⚔️ افزایش قدرت حمله</button>
    </div>
    <button id="closeUpgrades">بستن</button>
  </section>
  <section id="craftPanel" class="panel" hidden>
    <h2>🛠️ ساخت ابزار و تجهیزات</h2>
    <p>با منابعی که جمع کردی، تجهیزاتت رو بهتر کن.</p>
    <div class="upgrade-list">
      <button id="craftSword">⚔️ شمشیر فولادی — ۵ آهن + ۳ چوب</button>
      <button id="craftBoots">👟 چکمه تندرو — ۴ آهن + ۶ چوب</button>
      <button id="craftPotion">🧪 معجون سلامتی — ۲ کریستال + ۱ آهن</button>
    </div>
    <button id="closeCraft">بستن</button>
  </section>
  <div id="toast" role="status"></div>
  <div id="controls">
    <div id="joystick"><div id="stick"></div></div>
    <button id="actionBtn">⛏️<small>برداشت</small></button>
    <button id="attackBtn">⚔️<small>حمله</small></button>
    <button id="caveBtn" hidden>🕳️ ورود به غار</button>
  </div>
  <div id="help">با جوی‌استیک حرکت کن؛ برای جمع‌آوری برداشت و برای دفاع حمله را بزن.</div>
  <script src="adventure.js"></script>
</body>
</html>
