<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Island</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1c23;
            font-family: monospace;
        }
        #gameCanvas {
            display: block;
            background-color: #2d5a27;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-size: 14px;
            pointer-events: none;
        }
        .ui-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="ui-box">💰 سکه: <span id="coins">0</span></div>
        <div class="ui-box">⭐ سطح ابزار: <span id="toolTier">Tier 1 (چوبی)</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
