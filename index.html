<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Island</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1c23; font-family: monospace; }
        #gameCanvas { display: block; background: #2d5a27; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; color: white; font-size: 13px; pointer-events: none; }
        .ui-box { background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px; border: 2px solid #555; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="ui-box">💰 <span id="coins">0</span></div>
        <div class="ui-box">⭐ <span id="toolTier">Tier 1</span></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 28,
            speed: 4,
            coins: 0,
            level: 1,
            xp: 0,
            xpToNextLevel: 50,
            power: 1,
            toolTier: 1
        };

        const worker = {
            x: canvas.width / 2 + 40,
            y: canvas.height / 2 + 40,
            size: 20,
            speed: 2,
            active: false,
            cost: 150
        };

        const resources = [
            { x: 80, y: 120, type: 'tree', hp: 5, maxHp: 5, coins: 10, xp: 15, size: 36 },
            { x: 250, y: 220, type: 'tree', hp: 5, maxHp: 5, coins: 10, xp: 15, size: 36 },
            { x: 150, y: 380, type: 'rock', hp: 12, maxHp: 12, coins: 30, xp: 35, size: 32 },
            { x: 300, y: 450, type: 'gold', hp: 25, maxHp: 25, coins: 100, xp: 80, size: 28 }
        ];

        const floatingTexts = [];
        let touchX = null;
        let touchY = null;

        canvas.addEventListener('touchstart', (e) => {
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            touchX = e.touches[0].clientX;
            touchY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', () => {
            touchX = null;
            touchY = null;
        });

        function addFloatingText(text, x, y, color = '#f1c40f') {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        function updateUI() {
            const coinsElem = document.getElementById('coins');
            const toolElem = document.getElementById('toolTier');
            let botStatus = worker.active ? '🤖 فعال' : `🤖 (${worker.cost} 💰)`;
            
            if (coinsElem) coinsElem.innerText = `${Math.floor(player.coins)} 💰 | Lvl ${player.level}`;
            if (toolElem) toolElem.innerText = `ابزار T${player.toolTier} | ${botStatus}`;
        }

        function update() {
            if (touchX !== null && touchY !== null) {
                const dx = touchX - player.x;
                const dy = touchY - player.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    player.x += (dx / dist) * player.speed;
                    player.y += (dy / dist) * player.speed;
                }
            }

            const half = player.size / 2;
            if (player.x - half < 0) player.x = half;
            if (player.x + half > canvas.width) player.x = canvas.width - half;
            if (player.y - half < 0) player.y = half;
            if (player.y + half > canvas.height) player.y = canvas.height - half;

            if (!worker.active && player.coins >= worker.cost) {
                player.coins -= worker.cost;
                worker.active = true;
                addFloatingText('کارگر استخدام شد! 🤖', player.x, player.y - 30, '#3498db');
                updateUI();
            }

            if (worker.active) {
                let nearestRes = resources[0];
                let minDist = Infinity;
                resources.forEach(res => {
                    const d = Math.hypot(worker.x - res.x, worker.y - res.y);
                    if (d < minDist) {
                        minDist = d;
                        nearestRes = res;
                    }
                });

                if (nearestRes) {
                    const dx = nearestRes.x - worker.x;
                    const dy = nearestRes.y - worker.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 5) {
                        worker.x += (dx / dist) * worker.speed;
                        worker.y += (dy / dist) * worker.speed;
                    }
                }
            }

            resources.forEach(res => {
                const distP = Math.hypot(player.x - res.x, player.y - res.y);
                if (distP < (player.size / 2 + res.size / 2)) {
                    res.hp -= 0.04 * player.power;
                }

                if (worker.active) {
                    const distW = Math.hypot(worker.x - res.x, worker.y - res.y);
                    if (distW < (worker.size / 2 + res.size / 2)) {
                        res.hp -= 0.03;
                    }
                }

                if (res.hp <= 0) {
                    player.coins += res.coins;
                    player.xp += res.xp;

                    addFloatingText(`+${res.coins} 💰`, res.x, res.y);

                    if (player.xp >= player.xpToNextLevel) {
                        player.xp -= player.xpToNextLevel;
                        player.level++;
                        player.xpToNextLevel = Math.floor(player.xpToNextLevel * 1.6);
                        player.power += 0.3;
                        addFloatingText('LEVEL UP! ⭐', player.x, player.y - 20, '#2ecc71');
                    }

                    const upgradeCost = player.toolTier * 90;
                    if (player.coins >= upgradeCost) {
                        player.coins -= upgradeCost;
                        player.toolTier++;
                        player.power += 1.2;
                        addFloatingText(`ارتقای ابزار! ⛏️`, player.x, player.y - 40, '#e67e22');
                    }

                    updateUI();

                    res.x = Math.random() * (canvas.width - 60) + 30;
                    res.y = Math.random() * (canvas.height - 100) + 50;
                    res.hp = res.maxHp;
                }
            });

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 0.8;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function drawTree(x, y) {
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(x - 4, y + 2, 8, 14);
            ctx.fillStyle = '#3d2b22';
            ctx.fillRect(x + 1, y + 2, 3, 14);

            ctx.fillStyle = '#1e824c';
            ctx.fillRect(x - 16, y - 8, 32, 14);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(x - 12, y - 18, 24, 14);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x - 8, y - 24, 16, 10);
        }

        function drawRock(x, y) {
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(x - 14, y - 10, 28, 20);
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(x - 14, y - 10, 20, 6);
            ctx.fillStyle = '#34495e';
            ctx.fillRect(x - 6, y + 2, 20, 8);
        }

        function drawGold(x, y) {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(x - 12, y - 10, 24, 20);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(x - 4, y + 2, 16, 8);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x - 8, y - 8, 4, 4);
        }

        function drawPlayer(x, y) {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x - 10, y - 4, 20, 16);
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(x - 8, y - 16, 16, 12);
            ctx.fillStyle = '#4a2c11';
            ctx.fillRect(x - 8, y - 18, 16, 4);
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 5, y - 12, 3, 3);
            ctx.fillRect(x + 2, y - 12, 3, 3);
        }

        function drawWorker(x, y) {
            ctx.fillStyle = '#3498db';
            ctx.fillRect(x - 8, y - 8, 16, 16);
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(x - 8, y + 2, 16, 6);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x - 5, y - 4, 3, 3);
            ctx.fillRect(x + 2, y - 4, 3, 3);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            resources.forEach(res => {
                if (res.type === 'tree') drawTree(res.x, res.y);
                else if (res.type === 'rock') drawRock(res.x, res.y);
                else if (res.type === 'gold') drawGold(res.x, res.y);

                const hpPercent = Math.max(0, res.hp / res.maxHp);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(res.x - 15, res.y - res.size / 2 - 12, 30, 4);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(res.x - 15, res.y - res.size / 2 - 12, 30 * hpPercent, 4);
            });

            if (worker.active) drawWorker(worker.x, worker.y);
            drawPlayer(player.x, player.y);

            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.font = 'bold 13px monospace';
                ctx.fillText(ft.text, ft.x - 15, ft.y);
                ctx.globalAlpha = 1;
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        updateUI();
        loop();
    </script>
</body>
</html>
