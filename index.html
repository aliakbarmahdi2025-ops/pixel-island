<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Island</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1c23; font-family: monospace; }
        #gameCanvas { display: block; background: #2d5a27; image-rendering: pixelated; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; color: white; font-size: 13px; pointer-events: none; z-index: 5; }
        .ui-box { background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 8px; border: 2px solid #555; }
        .btn-ui { pointer-events: auto; background: #f39c12; color: #fff; border: 2px solid #d35400; padding: 6px 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: monospace; font-size: 12px; }
        .btn-ui:active { transform: scale(0.95); }
        #travelBtn { background: #e74c3c; border-color: #c0392b; display: none; }
        #saveBtn { background: #2ecc71; border-color: #27ae60; }
        
        #shopMenu { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 340px; background: rgba(20, 20, 30, 0.95); border: 3px solid #f1c40f; border-radius: 12px; padding: 15px; color: white; z-index: 10; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #shopMenu h2 { text-align: center; color: #f1c40f; margin-bottom: 12px; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; }
        .buy-btn { background: #2ecc71; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: monospace; }
        .buy-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
        #closeShop { display: block; width: 100%; background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 6px; margin-top: 10px; font-weight: bold; cursor: pointer; font-family: monospace; }
    </style>
</head>
<body>
    <div id="ui">
        <div class="ui-box">💰 <span id="coins">0</span> | Lvl <span id="level">1</span></div>
        <div style="display: flex; gap: 5px;">
            <button id="saveBtn" class="btn-ui" onclick="manualSave()">💾 ذخیره</button>
            <button id="travelBtn" class="btn-ui" onclick="switchIsland()">🌋 آتشفشان</button>
            <button id="shopBtn" class="btn-ui" onclick="toggleShop()">🛒 فروشگاه</button>
        </div>
    </div>

    <div id="shopMenu">
        <h2>🛒 فروشگاه ارتقا</h2>
        <div class="shop-item">
            <div>
                <div>⚡ سرعت حرکت</div>
                <small id="speedLvl" style="color:#aaa;">Lvl 1</small>
            </div>
            <button class="buy-btn" id="buySpeed" onclick="buyUpgrade('speed')">50 💰</button>
        </div>
        <div class="shop-item">
            <div>
                <div>⛏️ قدرت تبر</div>
                <small id="powerLvl" style="color:#aaa;">Lvl 1</small>
            </div>
            <button class="buy-btn" id="buyPower" onclick="buyUpgrade('power')">80 💰</button>
        </div>
        <div class="shop-item">
            <div>
                <div>🤖 تعداد کارگر</div>
                <small id="workerLvl" style="color:#aaa;">0 کارگر</small>
            </div>
            <button class="buy-btn" id="buyWorker" onclick="buyUpgrade('worker')">150 💰</button>
        </div>
        <button id="closeShop" onclick="toggleShop()">بستن ✖</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let currentIsland = 'forest';

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 28,
            speed: 4,
            speedLvl: 1,
            coins: 0,
            level: 1,
            xp: 0,
            xpToNextLevel: 50,
            power: 1,
            powerLvl: 1
        };

        let workers = [];
        let workerCost = 150;

        function loadGame() {
            try {
                const savedData = localStorage.getItem('pixelIslandSave_v2');
                if (savedData) {
                    const data = JSON.parse(savedData);
                    player.coins = data.coins || 0;
                    player.level = data.level || 1;
                    player.xp = data.xp || 0;
                    player.xpToNextLevel = data.xpToNextLevel || 50;
                    player.speed = data.speed || 4;
                    player.speedLvl = data.speedLvl || 1;
                    player.power = data.power || 1;
                    player.powerLvl = data.powerLvl || 1;
                    workerCost = data.workerCost || 150;
                    
                    if (data.workerCount) {
                        for (let i = 0; i < data.workerCount; i++) {
                            workers.push({
                                x: canvas.width / 2 + (Math.random() * 40 - 20),
                                y: canvas.height / 2 + (Math.random() * 40 - 20),
                                size: 20,
                                speed: 2 + Math.random() * 0.5
                            });
                        }
                    }
                }
            } catch(e) {
                console.log('Save load failed');
            }
        }

        function saveGame() {
            try {
                const data = {
                    coins: player.coins,
                    level: player.level,
                    xp: player.xp,
                    xpToNextLevel: player.xpToNextLevel,
                    speed: player.speed,
                    speedLvl: player.speedLvl,
                    power: player.power,
                    powerLvl: player.powerLvl,
                    workerCount: workers.length,
                    workerCost: workerCost
                };
                localStorage.setItem('pixelIslandSave_v2', JSON.stringify(data));
            } catch(e) {
                console.log('Save failed');
            }
        }

        function manualSave() {
            saveGame();
            addFloatingText('بازی ذخیره شد! 💾', player.x, player.y - 30, '#2ecc71');
        }

        loadGame();

        const forestResources = [
            { x: 80, y: 120, type: 'tree', hp: 5, maxHp: 5, coins: 10, xp: 15, size: 36 },
            { x: 250, y: 220, type: 'tree', hp: 5, maxHp: 5, coins: 10, xp: 15, size: 36 },
            { x: 150, y: 380, type: 'rock', hp: 12, maxHp: 12, coins: 30, xp: 35, size: 32 },
            { x: 300, y: 450, type: 'gold', hp: 25, maxHp: 25, coins: 100, xp: 80, size: 28 }
        ];

        const volcanoResources = [
            { x: 100, y: 150, type: 'crystal', hp: 20, maxHp: 20, coins: 80, xp: 60, size: 34 },
            { x: 280, y: 250, type: 'crystal', hp: 20, maxHp: 20, coins: 80, xp: 60, size: 34 },
            { x: 180, y: 400, type: 'lava_rock', hp: 45, maxHp: 45, coins: 200, xp: 120, size: 36 }
        ];

        let activeResources = forestResources;
        const floatingTexts = [];
        let touchX = null;
        let touchY = null;

        canvas.addEventListener('touchstart', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (touchX !== null) {
                touchX = e.touches[0].clientX;
                touchY = e.touches[0].clientY;
            }
        });

        canvas.addEventListener('touchend', () => {
            touchX = null;
            touchY = null;
        });

        function switchIsland() {
            if (currentIsland === 'forest') {
                currentIsland = 'volcano';
                activeResources = volcanoResources;
                canvas.style.background = '#3a1e1e';
                document.getElementById('travelBtn').innerText = '🌲 جنگل';
                addFloatingText('جزیره آتشفشان! 🌋', player.x, player.y - 30, '#e74c3c');
            } else {
                currentIsland = 'forest';
                activeResources = forestResources;
                canvas.style.background = '#2d5a27';
                document.getElementById('travelBtn').innerText = '🌋 آتشفشان';
                addFloatingText('بازگشت به جنگل! 🌲', player.x, player.y - 30, '#2ecc71');
            }
        }

        function toggleShop() {
            const menu = document.getElementById('shopMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
            updateUI();
        }

        function buyUpgrade(type) {
            if (type === 'speed') {
                const cost = Math.floor(50 * Math.pow(1.5, player.speedLvl - 1));
                if (player.coins >= cost) {
                    player.coins -= cost;
                    player.speedLvl++;
                    player.speed += 0.8;
                    addFloatingText('سرعت زیاد شد! ⚡', player.x, player.y - 30, '#f1c40f');
                }
            } else if (type === 'power') {
                const cost = Math.floor(80 * Math.pow(1.6, player.powerLvl - 1));
                if (player.coins >= cost) {
                    player.coins -= cost;
                    player.powerLvl++;
                    player.power += 0.8;
                    addFloatingText('تبر قوی‌تر شد! ⛏️', player.x, player.y - 30, '#e67e22');
                }
            } else if (type === 'worker') {
                if (player.coins >= workerCost) {
                    player.coins -= workerCost;
                    workers.push({
                        x: player.x + (Math.random() * 40 - 20),
                        y: player.y + (Math.random() * 40 - 20),
                        size: 20,
                        speed: 2 + Math.random() * 0.5
                    });
                    workerCost = Math.floor(workerCost * 1.8);
                    addFloatingText('کارگر جدید! 🤖', player.x, player.y - 30, '#3498db');
                }
            }
            saveGame();
            updateUI();
        }

        function addFloatingText(text, x, y, color = '#f1c40f') {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        function updateUI() {
            document.getElementById('coins').innerText = Math.floor(player.coins);
            document.getElementById('level').innerText = player.level;

            if (player.level >= 5) {
                document.getElementById('travelBtn').style.display = 'inline-block';
            }

            const speedCost = Math.floor(50 * Math.pow(1.5, player.speedLvl - 1));
            const powerCost = Math.floor(80 * Math.pow(1.6, player.powerLvl - 1));

            document.getElementById('speedLvl').innerText = `Lvl ${player.speedLvl}`;
            document.getElementById('buySpeed').innerText = `${speedCost} 💰`;
            document.getElementById('buySpeed').disabled = player.coins < speedCost;

            document.getElementById('powerLvl').innerText = `Lvl ${player.powerLvl}`;
            document.getElementById('buyPower').innerText = `${powerCost} 💰`;
            document.getElementById('buyPower').disabled = player.coins < powerCost;

            document.getElementById('workerLvl').innerText = `${workers.length} کارگر`;
            document.getElementById('buyWorker').innerText = `${workerCost} 💰`;
            document.getElementById('buyWorker').disabled = player.coins < workerCost;
        }

        let saveTimer = 0;

        function update() {
            if (touchX !== null && touchY !== null) {
                const dx = touchX - player.x;
                const dy = touchY - player.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    player.x += (dx / dist) * player.speed;
                    player.y += (dy / dist) * player.speed;
                }
            }

            const half = player.size / 2;
            if (player.x - half < 0) player.x = half;
            if (player.x + half > canvas.width) player.x = canvas.width - half;
            if (player.y - half < 0) player.y = half;
            if (player.y + half > canvas.height) player.y = canvas.height - half;

            workers.forEach(w => {
                let nearestRes = activeResources[0];
                let minDist = Infinity;
                activeResources.forEach(res => {
                    const d = Math.hypot(w.x - res.x, w.y - res.y);
                    if (d < minDist) {
                        minDist = d;
                        nearestRes = res;
                    }
                });

                if (nearestRes) {
                    const dx = nearestRes.x - w.x;
                    const dy = nearestRes.y - w.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 5) {
                        w.x += (dx / dist) * w.speed;
                        w.y += (dy / dist) * w.speed;
                    }
                }
            });

            activeResources.forEach(res => {
                const distP = Math.hypot(player.x - res.x, player.y - res.y);
                if (distP < (player.size / 2 + res.size / 2)) {
                    res.hp -= 0.04 * player.power;
                }

                workers.forEach(w => {
                    const distW = Math.hypot(w.x - res.x, w.y - res.y);
                    if (distW < (w.size / 2 + res.size / 2)) {
                        res.hp -= 0.03;
                    }
                });

                if (res.hp <= 0) {
                    player.coins += res.coins;
                    player.xp += res.xp;

                    addFloatingText(`+${res.coins} 💰`, res.x, res.y);

                    if (player.xp >= player.xpToNextLevel) {
                        player.xp -= player.xpToNextLevel;
                        player.level++;
                        player.xpToNextLevel = Math.floor(player.xpToNextLevel * 1.6);
                        player.power += 0.2;
                        addFloatingText('LEVEL UP! ⭐', player.x, player.y - 20, '#2ecc71');
                    }

                    updateUI();

                    res.x = Math.random() * (canvas.width - 60) + 30;
                    res.y = Math.random() * (canvas.height - 100) + 50;
                    res.hp = res.maxHp;
                }
            });

            saveTimer++;
            if (saveTimer > 300) {
                saveGame();
                saveTimer = 0;
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 0.8;
                ft.alpha -= 0.02;
                if (ft.alpha <= 0) floatingTexts.splice(i, 1);
            }
        }

        function drawTree(x, y) {
            ctx.fillStyle = '#5c4033';
            ctx.fillRect(x - 4, y + 2, 8, 14);
            ctx.fillStyle = '#1e824c';
            ctx.fillRect(x - 16, y - 8, 32, 14);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(x - 12, y - 18, 24, 14);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x - 8, y - 24, 16, 10);
        }

        function drawRock(x, y) {
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(x - 14, y - 10, 28, 20);
            ctx.fillStyle = '#95a5a6';
            ctx.fillRect(x - 14, y - 10, 20, 6);
        }

        function drawGold(x, y) {
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(x - 12, y - 10, 24, 20);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x - 8, y - 8, 4, 4);
        }

        function drawCrystal(x, y) {
            ctx.fillStyle = '#9b59b6';
            ctx.fillRect(x - 10, y - 14, 20, 28);
            ctx.fillStyle = '#8e44ad';
            ctx.fillRect(x - 4, y - 14, 14, 28);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x - 4, y - 10, 4, 8);
        }

        function drawLavaRock(x, y) {
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(x - 16, y - 12, 32, 24);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(x - 8, y - 4, 20, 10);
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x - 12, y - 8, 8, 8);
        }

        function drawPlayer(x, y) {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(x - 10, y - 4, 20, 16);
            ctx.fillStyle = '#ffcc99';
            ctx.fillRect(x - 8, y - 16, 16, 12);
            ctx.fillStyle = '#4a2c11';
            ctx.fillRect(x - 8, y - 18, 16, 4);
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 5, y - 12, 3, 3);
            ctx.fillRect(x + 2, y - 12, 3, 3);
        }

        function drawWorker(x, y) {
            ctx.fillStyle = '#3498db';
            ctx.fillRect(x - 8, y - 8, 16, 16);
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(x - 5, y - 4, 3, 3);
            ctx.fillRect(x + 2, y - 4, 3, 3);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.
